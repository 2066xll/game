name = "game-website"

[[durable_objects.bindings]]
name = "CHAT_ROOM"
script_name = "websocket-worker"
class_name = "ChatRoomDurableObject"

[[d1_databases]]
binding = "DB"
database_name = "game-chat-db"
database_id = "73606391-5970-4435-8dbe-d0be3a201d0a"

[[kv_namespaces]]
binding = "SESSION_STORE"
id = "0a46093b30dc43eb999c7ae4c3e94a83"
preview_id = "620a37a62e7940c5b849e13837095c0b"

[pages]
build_output_dir = "dist"

# 消息清理Worker配置
[[workers]]
  name = "message-cleanup-worker"
  script = "src/workers/messageCleanupWorker.js"
  
  [workers.bindings]
  # 数据库绑定
  [[workers.bindings.d1_database]]
  binding = "DB"
  database_id = "73606391-5970-4435-8dbe-d0be3a201d0a"
  
  # API密钥（使用Secrets安全存储）
  [[workers.bindings.secret]]
  name = "CLEANUP_API_KEY"

# 定时触发器配置（每小时执行一次清理）
[[triggers.cron]]
  cron = "0 * * * *"  # 每小时整点执行
  target = "message-cleanup-worker"
  routes = ["/__scheduled"]

[build]
command = "npm run build"

[env.production]
name = "game-website-production"

[env.development]
name = "game-website-development"
