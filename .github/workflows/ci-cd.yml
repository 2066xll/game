name: Game Website CI/CD

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # 代码检查和测试
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 设置超时时间
    
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
        fetch-depth: 0
    
    - name: 环境信息和调试
      run: |
        echo "=== 环境信息 ==="
        git --version
        node --version
        npm --version
        echo "当前目录: $(pwd)"
        echo "目录结构:"
        ls -la
    
    - name: 显式子模块初始化和更新
      id: submodule_init
      timeout-minutes: 10  # 设置子模块初始化超时
      continue-on-error: false  # 子模块失败时停止整个工作流
      run: |
        # 确保使用HTTPS而不是SSH访问GitHub
        git config --global url.https://github.com/.insteadOf git@github.com/
        git config --global http.postBuffer 524288000  # 增加缓冲区大小
        
        echo "开始初始化子模块..."
        git submodule sync --recursive
        git submodule update --init --recursive --force
        
        echo "子模块初始化完成，检查状态:"
        git submodule status
        
        # 检查子模块目录是否存在且不为空
        if [ -d "public/game-website-core" ] && [ "$(ls -A public/game-website-core)" ]; then
          echo "子模块目录存在且包含内容"
          ls -la public/game-website-core
        else
          echo "错误: 子模块目录不存在或为空"
          exit 1
        fi
    
    - name: 设置Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: 安装依赖
      run: npm install
    
    - name: 运行代码检查
      run: npm run lint
      if: github.ref != 'refs/heads/main'
    
    - name: 运行测试
      run: npm run test
      if: github.ref != 'refs/heads/main'

  # 生产环境构建和部署
  build-and-deploy:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 40  # 设置超时时间
    
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
        fetch-depth: 0
    
    - name: 环境信息和调试
      run: |
        echo "=== 环境信息 ==="
        git --version
        node --version
        npm --version
        echo "当前目录: $(pwd)"
        echo "目录结构:"
        ls -la
    
    - name: 显式子模块初始化和更新
      id: submodule_init
      timeout-minutes: 10  # 设置子模块初始化超时
      continue-on-error: false  # 子模块失败时停止整个工作流
      run: |
        # 确保使用HTTPS而不是SSH访问GitHub
        git config --global url.https://github.com/.insteadOf git@github.com/
        git config --global http.postBuffer 524288000  # 增加缓冲区大小
        
        echo "开始初始化子模块..."
        git submodule sync --recursive
        git submodule update --init --recursive --force
        
        echo "子模块初始化完成，检查状态:"
        git submodule status
        
        # 检查子模块目录是否存在且不为空
        if [ -d "public/game-website-core" ] && [ "$(ls -A public/game-website-core)" ]; then
          echo "子模块目录存在且包含内容"
          ls -la public/game-website-core
        else
          echo "错误: 子模块目录不存在或为空"
          exit 1
        fi
    
    - name: 设置Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: 安装依赖
      run: npm install
    
    - name: 构建项目
      run: npm run build
    
    - name: 部署到Cloudflare Pages
      uses: cloudflare/pages-action@v1
      with:
        # 注意：需要在GitHub仓库的Settings > Secrets and variables > Actions中设置以下密钥
        # CLOUDFLARE_API_TOKEN: 具有Pages编辑权限的Cloudflare API令牌
        # CLOUDFLARE_ACCOUNT_ID: Cloudflare账户ID
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        projectName: game-website
        directory: dist
        environment: production
        # 可选配置
        # enablePagesFunctions: true
        # wranglerVersion: 'latest'

  # 开发环境构建（不部署）
  build-dev:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    timeout-minutes: 40  # 设置超时时间
    
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
        fetch-depth: 0
    
    - name: 环境信息和调试
      run: |
        echo "=== 环境信息 ==="
        git --version
        node --version
        npm --version
        echo "当前目录: $(pwd)"
        echo "目录结构:"
        ls -la
    
    - name: 显式子模块初始化和更新
      id: submodule_init
      timeout-minutes: 10  # 设置子模块初始化超时
      continue-on-error: false  # 子模块失败时停止整个工作流
      run: |
        # 确保使用HTTPS而不是SSH访问GitHub
        git config --global url.https://github.com/.insteadOf git@github.com/
        git config --global http.postBuffer 524288000  # 增加缓冲区大小
        
        echo "开始初始化子模块..."
        git submodule sync --recursive
        git submodule update --init --recursive --force
        
        echo "子模块初始化完成，检查状态:"
        git submodule status
        
        # 检查子模块目录是否存在且不为空
        if [ -d "public/game-website-core" ] && [ "$(ls -A public/game-website-core)" ]; then
          echo "子模块目录存在且包含内容"
          ls -la public/game-website-core
        else
          echo "错误: 子模块目录不存在或为空"
          exit 1
        fi
    
    - name: 设置Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: 安装依赖
      run: npm install
    
    - name: 构建开发版本
      run: npm run build:dev
    
    - name: 保存构建产物
      uses: actions/upload-artifact@v3
      with:
        name: dev-build
        path: dist
